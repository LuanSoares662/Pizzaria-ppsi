<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony Pizzaria</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="img/logo.png" alt="Tony Pizzaria">
            </div>
            <nav class="navbar">
                <ul>
                    <li><a href="#home">HOME</a></li>
                    <li><a href="#cardapio">CARDAPIO</a></li>
                    <li><a href="#servicos">SERVIÇOS</a></li>
                    <li><a href="#localizacao">LOCALIZAÇÃO</a></li>
                    <li><a href="#contato">CONTATO</a></li>
                </ul>
            </nav>
        </header>

        <main class="hero">
            <div class="hero-text">
                <h1>
                    Não é apenas<br>
                    uma <span class="destaque">Pizza</span>, é<br>
                    uma experiência!
                </h1>
            </div>
            <div class="hero-image">
                <img src="/img/pizzacentral.png" alt="pizzacentral">
            </div>
        </main>




        <footer>
            <img src="img/pizza01.png" alt="imagem01">
            <img src="img/pizza02.png" alt="imagem02">
            <img src="img/pizza03.png" alt="imagem03">
            <img src="img/pizza04.png" alt="imagem04">
        </footer>
    </div>
</body>
 
</html>
